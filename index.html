const $=s=>document.querySelector(s),esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const sh=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const store=f=>{try{return f()}catch(e){}};
let name='',hist=[],Q=[],ans=[],done=false,warned=false;
const key=()=>'chem1:'+name.toLowerCase();
store(()=>{$('#nm').value=localStorage.getItem('chem1:last')||''});

function start(){
 const v=$('#nm').value.trim();
 if(v.length<2){$('#err').textContent='اكتب اسمك بالكامل (حرفين على الأقل)';return}
 name=v;
 hist=store(()=>JSON.parse(localStorage.getItem(key())||'[]'))||[];
 store(()=>localStorage.setItem('chem1:last',name));
 $('#reg').hidden=true;$('#ex').hidden=false;fresh();
}
function fresh(){
 Q=D.map(([q,o,c,l],i)=>({q,l,e:E[i],o:sh(o.split('|').map((t,i)=>({t,c:i==c})))}));
 ans=Array(60).fill(-1);done=false;warned=false;
 $('#main').innerHTML='<div id="res" hidden></div>'+Q.map((x,i)=>
  (i==0?'<h2>الجزء الأول: اختر الإجابة الصحيحة (40 سؤال)</h2>':i==40?'<h2>الجزء الثاني: الأسئلة المقالية بصيغة MCQ (20 سؤال)</h2>':'')+
  `<div class="q" id="q${i}"><p><b>${i+1}.</b> <span class="lv l${x.l}">${["","سهل","متوسط","فوق متوسط","صعب"][x.l]}</span> ${x.q}</p>`+
  x.o.map((o,j)=>`<label class="o"><input type="radio" name="q${i}" value="${j}"><span dir="auto">${o.t}</span></label>`).join('')+'</div>').join('')+
  '<p id="msg"></p><button class="btn" id="sub2">تسليم الامتحان</button>';
 side();scrollTo(0,0);
}
function side(){
 const a=ans.filter(v=>v>=0).length;
 $('#side').innerHTML=`<h3>👤 ${esc(name)}</h3>
 <p style="margin:0"><b>${esc(name)}</b> — عدد المحاولات المسلّمة: <b>${hist.length}</b><br>المحاولة الحالية: <b>${hist.length+(done?0:1)}</b></p>
 <div class="bar" style="margin-top:10px"><i style="width:${a/.6}%"></i></div><small>تمت الإجابة على ${a} من 60</small>
 <div class="nav">${Q.map((x,i)=>`<button data-i="${i}" class="${done?(x.o[ans[i]]?.c?'ok':'bad'):ans[i]>=0?'on':''}">${i+1}</button>`).join('')}</div>
 <button class="btn" id="sub1" ${done?'disabled':''}>تسليم</button>
 <h4>نتيجة كل محاولة</h4>${hist.length?'<ol class="hist">'+hist.map(h=>`<li><b>${esc(name)}</b>: <b>${h.s}/60</b> (${Math.round(h.s/.6)}%) <small>${h.d}</small></li>`).join('')+'</ol>':'<small>لا توجد محاولات بعد</small>'}
 <button class="lnk" id="chg">تغيير الاسم</button>`;
}
function submit(){
 if(done)return;
 const left=ans.filter(v=>v<0).length;
 if(left&&!warned){warned=true;$('#msg').textContent=`⚠️ لسه ${left} سؤال بدون إجابة. اضغط تسليم مرة تانية لو عايز تسلّم كده.`;$('#msg').scrollIntoView({block:'center'});return}
 const s=Q.reduce((n,x,i)=>n+(x.o[ans[i]]?.c?1:0),0),p=Math.round(s/.6);
 hist.push({s,d:new Date().toLocaleString('ar-EG',{dateStyle:'short',timeStyle:'short'})});
 store(()=>localStorage.setItem(key(),JSON.stringify(hist)));
 done=true;
 Q.forEach((x,i)=>{$('#q'+i).querySelectorAll('label').forEach((l,j)=>{l.classList.toggle('ok',x.o[j].c);l.classList.toggle('bad',ans[i]==j&&!x.o[j].c);l.firstChild.disabled=true})
  if(!x.o[ans[i]]?.c){const r=x.o.find(o=>o.c);$('#q'+i).insertAdjacentHTML('beforeend',`<div class="ex"><b>${ans[i]<0?'⚪ لم تجب على هذا السؤال':'❌ إجابتك خاطئة'}</b><br>✅ الإجابة الصحيحة: <b dir="auto">${r.t}</b><br>💡 الشرح: ${esc(x.e)}</div>`)}
 });
 const r=$('#res');r.hidden=false;
 r.innerHTML=`<h2>${s} / 60</h2><p>${p}% — ${p>=90?'ممتاز 🌟':p>=75?'جيد جدًا 👏':p>=50?'جيد، راجع الأخطاء بالأحمر':'محتاج مراجعة تانية للباب'}</p><button class="btn" id="again">محاولة جديدة</button>`;
 $('#msg').textContent='';$('#sub2').hidden=true;side();r.scrollIntoView({block:'start'});
}
$('#main').addEventListener('change',e=>{if(done||e.target.type!='radio')return;ans[+e.target.name.slice(1)]=+e.target.value;side()});
$('#nm').addEventListener('keydown',e=>{if(e.key=='Enter')start()});
document.addEventListener('click',e=>{
 const t=e.target.closest('button');if(!t)return;
 if(t.id=='go')start();
 else if(t.id=='sub1'||t.id=='sub2')submit();
 else if(t.id=='again')fresh();
 else if(t.id=='chg'){$('#ex').hidden=true;$('#reg').hidden=false;$('#err').textContent=''}
 else if(t.dataset.i!=null)$('#q'+t.dataset.i).scrollIntoView({behavior:'smooth',block:'center'});
});
</script>
